name: Build Preview (migration/v5, temporary)

# TEMPORARY — Stage 6 pre-cutover CI signal for the Quartz v5 migration. Deliberately a separate
# workflow file (not a modified copy of deploy.yml) with its own concurrency group and no
# pages/id-token permissions, so it structurally cannot deploy regardless of any misconfiguration
# — deploy.yml's real "pages" concurrency group and deploy job are completely untouched by this.
# Delete this file at Stage 7 cutover once migration/v5 merges to main.

on:
  push:
    branches:
      - migration/v5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "build-preview-v5"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Restore Quartz plugins
        run: npx quartz plugin restore

      - name: Build Quartz
        run: npx quartz build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quartz-v5-preview
          path: public
          retention-days: 7
