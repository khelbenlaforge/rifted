name: Debug Attachments (temporary)

on:
  push:
    branches:
      - debug/attachment-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "debug-attachments"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Quartz plugins
        run: npx quartz plugin restore

      - name: Check source content for the file
        run: |
          echo "=== ls content/zzz_Attachments | grep -i adon ==="
          ls -la "content/zzz_Attachments/" | grep -i adon || echo "NOT FOUND IN SOURCE"
          echo "=== file byte listing ==="
          find content/zzz_Attachments -iname "*adon*" -exec ls -la {} \;

      - name: Build Quartz
        run: npx quartz build --verbose 2>&1 | tee build.log

      - name: Check build output for the file
        run: |
          echo "=== find public -iname '*adon*' ==="
          find public -iname "*adon*" || echo "NOT FOUND IN OUTPUT"
          echo "=== zzz_attachments dir in output ==="
          find public -iname "*zzz_attach*" -maxdepth 1 -type d
          ls -la public/zzz_attachments/ 2>&1 | head -20 || echo "NO SUCH OUTPUT DIR"
          echo "=== grep build log for adon/zzz_attach ==="
          grep -i "adon\|zzz_attach" build.log | head -20 || echo "no matches in build log"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-attachments
          path: public
          retention-days: 3
