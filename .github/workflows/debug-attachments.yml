name: Debug Attachments (temporary)

on:
  push:
    branches:
      - fix/asset-slug-casing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "debug-attachments"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz.lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Quartz plugins
        run: npx quartz plugin restore

      - name: Build Quartz
        run: npx quartz build --verbose 2>&1 | tee build.log

      - name: Check build output for the file
        run: |
          echo "=== find public -iname '*adon*' ==="
          find public -iname "*adon*" || echo "NOT FOUND IN OUTPUT"
          echo "=== grep build log for Assets emit of adon ==="
          grep -i "emit:Assets.*adon" build.log || echo "no matches in build log"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-attachments-2
          path: public
          retention-days: 3
