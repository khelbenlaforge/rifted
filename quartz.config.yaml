# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: The Exodus
  pageTitleSuffix: " | The Exodus"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: khelbenlaforge.github.io/rifted
  ignorePatterns:
    - private
    - templates
    - .obsidian
  defaultDateType: modified
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Cinzel
      body: Atkinson Hyperlegible Next
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf7f0"
        lightgray: "#e8e0d0"
        gray: "#8c7b6e"
        darkgray: "#3d2b1f"
        dark: "#1a0a00"
        secondary: "#922610"
        tertiary: "#c5860a"
        highlight: rgba(197, 134, 10, 0.15)
        textHighlight: rgba(197, 134, 10, 0.4)
      darkMode:
        light: "#1a1e24"
        lightgray: "#252c36"
        gray: "#4e5b6f"
        darkgray: "#d4c5b0"
        dark: "#f0e6d3"
        secondary: "#c94d4d"
        tertiary: "#61afef"
        highlight: rgba(168, 60, 60, 0.15)
        textHighlight: "#7a141466"
plugins:
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: solarized-light
        dark: one-dark-pro
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: false
  - source: github:quartz-community/citations
    enabled: false
  - source: github:quartz-community/hard-line-breaks
    enabled: false
  - source: github:quartz-community/ox-hugo
    enabled: false
  - source: github:quartz-community/roam
    enabled: false
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: false
  - source: github:quartz-community/bases-page
    enabled: false
  - source: github:quartz-community/encrypted-pages
    enabled: false
  - source: github:quartz-community/stacked-pages
    enabled: false
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/comments
    enabled: false
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  # Replaced by github:khelbenlaforge/quartz-graph below (fork adding entity-type node
  # coloring) — must stay disabled, both export a component named "Graph".
  - source: github:quartz-community/graph
    enabled: false
  - source: github:quartz-community/table-of-contents
    enabled: true
    layout:
      position: right
      priority: 20
      display: desktop-only
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/footer
    enabled: true
    options:
      links: {}
  - source: github:khelbenlaforge/quartz-five-e-tools
    enabled: true
    options: {}
    order: 50
    layout:
      position: left
      priority: 60
      display: all
  - source: github:khelbenlaforge/quartz-player-note
    enabled: true
    options: {}
    order: 50
    layout:
      position: beforeBody
      priority: 40
      display: all
  - source: github:khelbenlaforge/quartz-session-notes
    enabled: true
    options: {}
    order: 50
    layout:
      position: left
      priority: 70
      display: all
  - source: github:khelbenlaforge/quartz-changelog
    enabled: true
    options: {}
    order: 50
    layout:
      position: left
      priority: 55
      display: all
  - source: github:khelbenlaforge/quartz-graph
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 1
        scale: 1.1
        repelForce: 0.5
        centerForce: 0.3
        linkDistance: 30
        fontSize: 0.6
        opacityScale: 1
        showTags: true
        removeTags: []
        focusOnHover: false
        enableRadial: false
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.9
        repelForce: 0.5
        centerForce: 0.2
        linkDistance: 30
        fontSize: 0.6
        opacityScale: 1
        showTags: true
        removeTags: []
        focusOnHover: true
        enableRadial: true
    order: 50
    layout:
      position: right
      priority: 10
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - tag-list
        - player-note
        - session-notes
        - five-e-tools
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - tag-list
        - player-note
        - session-notes
        - five-e-tools
      positions:
        right: []
    changelog:
      exclude:
        - reader-mode
        - tag-list
        - player-note
        - session-notes
        - five-e-tools
      positions:
        right: []
