# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "The Exodus"
  pageTitleSuffix: " | The Exodus"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: khelbenlaforge.github.io/rifted
  ignorePatterns:
    - private
    - templates
    - .obsidian
  defaultDateType: modified
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Cinzel
      body: Atkinson Hyperlegible Next
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf7f0"
        lightgray: "#e8e0d0"
        gray: "#8c7b6e"
        darkgray: "#3d2b1f"
        dark: "#1a0a00"
        secondary: "#922610"
        tertiary: "#c5860a"
        highlight: rgba(197, 134, 10, 0.15)
        textHighlight: rgba(197, 134, 10, 0.4)
      darkMode:
        light: "#1a1e24"
        lightgray: "#252c36"
        gray: "#4e5b6f"
        darkgray: "#d4c5b0"
        dark: "#f0e6d3"
        secondary: "#c94d4d"
        tertiary: "#61afef"
        highlight: rgba(168, 60, 60, 0.15)
        textHighlight: "#7a141466"
plugins:
  # --- transformers (order = markdown-processing sequence, matches v4's array order) ---
  # note-properties = v5's merge of v4's separate FrontMatter() transformer + a new properties-panel UI.
  # v4 never showed a properties panel, so hidePropertiesView:true suppresses the UI while keeping
  # frontmatter parsing active. Per Quartz docs this plugin must never be disabled.
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: solarized-light
        dark: one-dark-pro
      keepBackground: false
    order: 20
  # Full option list pinned explicitly to match v4.5.2's own ofm.ts defaultOptions verbatim
  # (v4 only overrode enableInHtmlEmbed; enableCheckbox differs from v5's own template default: false, not true).
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  # Disabled in v4 (commented out) — not needed for a campaign wiki, keep disabled.
  - source: github:quartz-community/latex
    enabled: false
  # v4 had a local latent citations.ts customization but the Citations plugin was never
  # registered in quartz.config.ts — confirmed dead/unused code, correctly dropped.
  - source: github:quartz-community/citations
    enabled: false
  - source: github:quartz-community/hard-line-breaks
    enabled: false
  - source: github:quartz-community/ox-hugo
    enabled: false
  - source: github:quartz-community/roam
    enabled: false

  # --- filters ---
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false

  # --- emitters / page types ---
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
    # sort: set via quartz.ts override in Stage 3 (alphabeticalFolderFirstSort, TS-only feature)
  - source: github:quartz-community/tag-page
    enabled: true
    # sort: set via quartz.ts override in Stage 3 (alphabeticalFolderFirstSort, TS-only feature)
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  # Disabled in v4 (commented out — slow to build, not needed for campaign wiki).
  - source: github:quartz-community/og-image
    enabled: false
  # No custom domain configured (site is served at khelbenlaforge.github.io/rifted).
  - source: github:quartz-community/cname
    enabled: false
  # Not part of v4's published surface.
  - source: github:quartz-community/canvas-page
    enabled: false
  - source: github:quartz-community/bases-page
    enabled: false
  - source: github:quartz-community/encrypted-pages
    enabled: false
  - source: github:quartz-community/stacked-pages
    enabled: false
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/comments
    enabled: false

  # --- layout components ---
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
    # sortFn: set via quartz.ts override in Stage 3 (explorerSortFn, TS-only feature)
  # Reserved slots (Stage 4): ChangelogLink priority 60, SessionNotes priority 70,
  # FiveETools priority 80 — added to this left column once their git-sourced plugin
  # repos exist. Do not reuse priorities 60/70/80 for anything else before Stage 4.

  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/table-of-contents
    enabled: true
    layout:
      position: right
      priority: 20
      display: desktop-only
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 30

  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # Reserved slot (Stage 4): PlayerNote beforeBody priority 40, added once its
  # git-sourced plugin repo exists.

  # v4 footer had no links — must not inherit either template's populated GitHub/Discord links.
  - source: github:quartz-community/footer
    enabled: true
    options:
      links: {}

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - tag-list
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
        - tag-list
      positions:
        right: []
